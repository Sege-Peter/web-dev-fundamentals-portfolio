<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practical Example 02: Responsive Navbar Drawer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="nav-logo">&lt;DevBrand /&gt;</a>

      <!-- Navigation Links -->
      <nav class="nav-menu" id="nav-menu" aria-label="Main menu">
        <ul class="nav-list">
          <li class="nav-item"><a href="#home" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="#features" class="nav-link">Features</a></li>
          <li class="nav-item"><a href="#pricing" class="nav-link">Pricing</a></li>
          <li class="nav-item"><a href="#blog" class="nav-link">Blog</a></li>
          <li class="nav-item"><a href="#contact" class="nav-link">Contact</a></li>
          <li class="nav-item nav-item-cta"><a href="#signup" class="btn btn-nav">Get Started</a></li>
        </ul>
      </nav>

      <!-- Hamburger Button (Mobile Only) -->
      <button 
        class="hamburger" 
        id="hamburger" 
        aria-label="Toggle navigation drawer" 
        aria-expanded="false" 
        aria-controls="nav-menu"
      >
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
  </header>

  <!-- Mobile Drawer Backdrop Overlay -->
  <div class="drawer-overlay" id="drawer-overlay"></div>

  <!-- Demo Content -->
  <main class="page-content">
    <div class="hero">
      <span class="badge">Practical Lab 02</span>
      <h1>Responsive Navigation Drawer</h1>
      <p>Resize your browser window below 768px or inspect in mobile emulation to test the smooth animated drawer, backdrop blur, and accessible hamburger icon.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
